<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Note Converter - Login</title>
 <style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f2f4f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
  h2 { margin-bottom: 20px; color: #222; text-align: center; }
  label { display: block; margin-top: 14px; font-size: 14px; color: #444; }
  input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { width: 100%; margin-top: 22px; padding: 12px; background: #305496; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #244070; }
  button:disabled { background: #999; cursor: not-allowed; }
  .toggle { text-align: center; margin-top: 16px; font-size: 14px; }
  .toggle a { color: #305496; cursor: pointer; text-decoration: underline; }
  .msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fdeaea; color: #b00020; display: block; }
  .msg.success { background: #e8f5e9; color: #1b5e20; display: block; }
</style>
</head>
<body>

<div class="card" id="authCard">
  <h2 id="formTitle">Log In</h2>
  <form id="authForm" novalidate>
    <label>Email</label>
    <input type="email" id="email" required>
    <label>Password</label>
    <input type="password" id="password" required minlength="6">
    <button type="submit" id="submitBtn">Log In</button>
  </form>
  <div class="msg" id="msgBox"></div>
  <div class="toggle">
    <span id="toggleText">Don't have an account? <a id="toggleLink">Sign Up</a></span>
  </div>
  <div class="toggle" id="forgotToggle">
    <a id="forgotLink">Forgot password?</a>
  </div>
</div>

<div class="card" id="forgotCard" style="display:none;">
  <h2>Reset Password</h2>
  <form id="forgotRequestForm" novalidate>
    <label>Email</label>
    <input type="email" id="forgotEmail" required>
    <button type="submit" id="forgotRequestBtn">Send Reset Code</button>
  </form>
  <form id="forgotResetForm" novalidate style="display:none;">
    <label>6-digit code (emailed to you)</label>
    <input type="text" id="forgotCode" maxlength="6" required>
    <label>New Password</label>
    <input type="password" id="forgotNewPassword" required minlength="6">
    <button type="submit" id="forgotResetBtn">Update Password</button>
  </form>
  <div class="msg" id="forgotMsgBox"></div>
  <div class="toggle">
    <a id="backToLoginLink">Back to Log In</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://jqqnnkzozjskziaizajg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg";

async function callRpc(fnName, payload) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fnName, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY
    },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("Server error (" + res.status + "): " + text);
  }
  return res.json();
}

const form = document.getElementById("authForm");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const toggleText = document.getElementById("toggleText");
const msgBox = document.getElementById("msgBox");
let mode = "login";

function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = "msg " + type;
}

function attachToggleHandler() {
  document.getElementById("toggleLink").addEventListener("click", handleToggleClick);
}

function handleToggleClick() {
  mode = mode === "login" ? "signup" : "login";
  if (mode === "signup") {
    formTitle.textContent = "Sign Up";
    submitBtn.textContent = "Sign Up";
    toggleText.innerHTML = 'Already have an account? <a id="toggleLink">Log In</a>';
  } else {
    formTitle.textContent = "Log In";
    submitBtn.textContent = "Log In";
    toggleText.innerHTML = 'Don\'t have an account? <a id="toggleLink">Sign Up</a>';
  }
  attachToggleHandler();
  msgBox.className = "msg";
}
attachToggleHandler();

form.addEventListener("submit", async function (e) {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMsg("Please enter both email and password.", "error");
    return;
  }

  submitBtn.disabled = true;
  showMsg("Please wait...", "success");

  try {
    if (mode === "signup") {
      const result = await callRpc("cn_signup", { p_email: email, p_password: password });
      if (!result.success) {
        showMsg(result.message, "error");
      } else {
        showMsg("Account created! Redirecting...", "success");
        setTimeout(function () { window.location.href = "pending.html"; }, 1000);
      }
    } else {
      const result = await callRpc("cn_login", { p_email: email, p_password: password });
      if (!result.success) {
        showMsg(result.message, "error");
      } else {
        localStorage.setItem("cn_token", result.token);
        localStorage.setItem("cn_email", result.email);
        if (result.status === "approved") {
          window.location.href = "app.html";
        } else if (result.status === "pending") {
          window.location.href = "pending.html";
        } else {
          showMsg("Your account access was rejected. Contact support: vkvcoder.support@gmail.com", "error");
        }
      }
    }
  } catch (err) {
    showMsg(err.message, "error");
  }

  submitBtn.disabled = false;
});

// ── Forgot password ──────────────────────────────────────────────
const authCard = document.getElementById("authCard");
const forgotCard = document.getElementById("forgotCard");
const forgotRequestForm = document.getElementById("forgotRequestForm");
const forgotResetForm = document.getElementById("forgotResetForm");
const forgotMsgBox = document.getElementById("forgotMsgBox");
let forgotEmailValue = "";

function showForgotMsg(text, type) {
  forgotMsgBox.textContent = text;
  forgotMsgBox.className = "msg " + type;
}

document.getElementById("forgotLink").addEventListener("click", function () {
  authCard.style.display = "none";
  forgotCard.style.display = "block";
  forgotRequestForm.style.display = "block";
  forgotResetForm.style.display = "none";
  forgotMsgBox.className = "msg";
});

document.getElementById("backToLoginLink").addEventListener("click", function () {
  forgotCard.style.display = "none";
  authCard.style.display = "block";
  forgotMsgBox.className = "msg";
});

forgotRequestForm.addEventListener("submit", async function (e) {
  e.preventDefault();
  const email = document.getElementById("forgotEmail").value.trim();
  if (!email) { showForgotMsg("Please enter your email.", "error"); return; }

  const btn = document.getElementById("forgotRequestBtn");
  btn.disabled = true;
  showForgotMsg("Sending code...", "success");

  try {
    await callRpc("cn_request_password_reset", { p_email: email });
    forgotEmailValue = email;
    showForgotMsg("If that email is registered, a 6-digit code has been sent. It expires in 10 minutes.", "success");
    forgotRequestForm.style.display = "none";
    forgotResetForm.style.display = "block";
  } catch (err) {
    showForgotMsg(err.message, "error");
  }
  btn.disabled = false;
});

forgotResetForm.addEventListener("submit", async function (e) {
  e.preventDefault();
  const code = document.getElementById("forgotCode").value.trim();
  const newPassword = document.getElementById("forgotNewPassword").value;
  if (!code || !newPassword) { showForgotMsg("Enter the code and a new password.", "error"); return; }

  const btn = document.getElementById("forgotResetBtn");
  btn.disabled = true;
  showForgotMsg("Updating password...", "success");

  try {
    const result = await callRpc("cn_reset_password", { p_email: forgotEmailValue, p_otp: code, p_new_password: newPassword });
    if (!result.success) {
      showForgotMsg(result.message, "error");
    } else {
      showForgotMsg("Password updated! You can now log in.", "success");
      setTimeout(function () {
        forgotCard.style.display = "none";
        authCard.style.display = "block";
        forgotMsgBox.className = "msg";
        forgotRequestForm.reset();
        forgotResetForm.reset();
      }, 1500);
    }
  } catch (err) {
    showForgotMsg(err.message, "error");
  }
  btn.disabled = false;
});
</script>

</body>
</html>
