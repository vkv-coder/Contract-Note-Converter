<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Note Converter - Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f2f4f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
  h2 { margin-bottom: 20px; color: #222; text-align: center; }
  label { display: block; margin-top: 14px; font-size: 14px; color: #444; }
  input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { width: 100%; margin-top: 22px; padding: 12px; background: #305496; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #244070; }
  button:disabled { background: #999; cursor: not-allowed; }
  .toggle { text-align: center; margin-top: 16px; font-size: 14px; }
  .toggle a { color: #305496; cursor: pointer; text-decoration: underline; }
  .msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fdeaea; color: #b00020; display: block; }
  .msg.success { background: #e8f5e9; color: #1b5e20; display: block; }
</style>
</head>
<body>

<div class="card">
  <h2 id="formTitle">Log In</h2>
  <form id="authForm" novalidate>
    <label>Email</label>
    <input type="email" id="email" required>
    <label>Password</label>
    <input type="password" id="password" required minlength="6">
    <button type="submit" id="submitBtn">Log In</button>
  </form>
  <div class="msg" id="msgBox"></div>
  <div class="toggle">
    <span id="toggleText">Don't have an account? <a id="toggleLink">Sign Up</a></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
window.addEventListener("error", function (e) {
  var box = document.getElementById("msgBox");
  if (box) {
    box.textContent = "A technical error occurred: " + e.message;
    box.className = "msg error";
  }
});

const SUPABASE_URL = "https://jqqnnkzozjskziaizajg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg";

const form = document.getElementById("authForm");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const toggleText = document.getElementById("toggleText");
const msgBox = document.getElementById("msgBox");

function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = "msg " + type;
}

if (!window.supabase || !window.supabase.createClient) {
  showMsg("Could not load required library. Please check your internet connection and refresh the page.", "error");
} else {
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let mode = "login";

  function attachToggleHandler() {
    const link = document.getElementById("toggleLink");
    link.addEventListener("click", handleToggleClick);
  }

  function handleToggleClick() {
    mode = mode === "login" ? "signup" : "login";
    if (mode === "signup") {
      formTitle.textContent = "Sign Up";
      submitBtn.textContent = "Sign Up";
      toggleText.innerHTML = 'Already have an account? <a id="toggleLink">Log In</a>';
    } else {
      formTitle.textContent = "Log In";
      submitBtn.textContent = "Log In";
      toggleText.innerHTML = 'Don\'t have an account? <a id="toggleLink">Sign Up</a>';
    }
    attachToggleHandler();
    msgBox.className = "msg";
  }
  attachToggleHandler();

  async function checkApprovalAndRedirect(userId) {
    const { data, error } = await supabase
      .from("cn_profiles")
      .select("status")
      .eq("id", userId)
      .single();

    if (error || !data) {
      showMsg("Could not verify account status: " + (error ? error.message : "no profile found"), "error");
      return;
    }
    if (data.status === "approved") {
      window.location.href = "app.html";
    } else if (data.status === "pending") {
      window.location.href = "pending.html";
    } else {
      showMsg("Your account access was rejected. Contact support: vkvcoder.support@gmail.com", "error");
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    e.stopPropagation();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMsg("Please enter both email and password.", "error");
      return;
    }

    submitBtn.disabled = true;
    showMsg("Please wait...", "success");

    try {
      if (mode === "signup") {
        const { data, error } = await supabase.auth.signUp({ email: email, password: password });
        if (error) {
          showMsg(error.message, "error");
        } else {
          showMsg("Account created! Redirecting to approval page...", "success");
          setTimeout(function () { window.location.href = "pending.html"; }, 1200);
        }
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (error) {
          showMsg(error.message, "error");
        } else {
          showMsg("Login successful. Checking approval status...", "success");
          await checkApprovalAndRedirect(data.user.id);
        }
      }
    } catch (err) {
      showMsg("Unexpected error: " + err.message, "error");
    }

    submitBtn.disabled = false;
    return false;
  });
}
</script>

</body>
</html>
