<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f2f4f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
  h2 { margin-bottom: 20px; color: #222; text-align: center; }
  label { display: block; margin-top: 14px; font-size: 14px; color: #444; }
  input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { width: 100%; margin-top: 22px; padding: 12px; background: #305496; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #244070; }
  button:disabled { background: #999; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
  .msg.error { background: #fdeaea; color: #b00020; display: block; }
  .msg.success { background: #e8f5e9; color: #1b5e20; display: block; }
</style>
</head>
<body>

<div class="card">
  <h2>Set New Password</h2>
  <form id="resetForm" novalidate>
    <label>New Password</label>
    <input type="password" id="password" required minlength="6">
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" required minlength="6">
    <button type="submit" id="submitBtn">Update Password</button>
  </form>
  <div class="msg" id="msgBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://jqqnnkzozjskziaizajg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg";

const msgBox = document.getElementById("msgBox");
const form = document.getElementById("resetForm");
const submitBtn = document.getElementById("submitBtn");

function showMsg(text, type) {
  msgBox.textContent = text;
  msgBox.className = "msg " + type;
}

if (!window.supabase || !window.supabase.createClient) {
  showMsg("Could not load required library. Please check your internet connection and refresh.", "error");
} else {
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const accessToken = params.get("access_token");
  const refreshToken = params.get("refresh_token");
  const type = params.get("type");

  if (!accessToken || type !== "recovery") {
    showMsg("This link is invalid or expired. Please request a new password recovery email.", "error");
    form.style.display = "none";
  } else {
    supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken })
      .then(function (result) {
        if (result.error) {
          showMsg("Could not verify reset link: " + result.error.message, "error");
          form.style.display = "none";
        }
      });
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      showMsg("Passwords do not match.", "error");
      return;
    }

    submitBtn.disabled = true;
    showMsg("Updating password...", "success");

    try {
      const { error } = await supabase.auth.updateUser({ password: password });
      if (error) {
        showMsg(error.message, "error");
      } else {
        showMsg("Password updated successfully! You can now log in with your new password.", "success");
        form.style.display = "none";
      }
    } catch (err) {
      showMsg("Unexpected error: " + err.message, "error");
    }

    submitBtn.disabled = false;
  });
}
</script>

</body>
</html>
