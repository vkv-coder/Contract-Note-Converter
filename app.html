<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract Note Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body { background: #f2f4f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
  h2 { color: #2e7d32; margin-bottom: 14px; }
  p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 10px; }
  .icon { font-size: 40px; margin-bottom: 14px; }
  button { margin-top: 20px; padding: 10px 18px; background: #305496; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="card" id="content">Checking your session...</div>

<script>
const SUPABASE_URL = "https://jqqnnkzozjskziaizajg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcW5ua3pvempza3ppYWl6YWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjk1ODAsImV4cCI6MjA4ODUwNTU4MH0.sEYeWnm0dvuw8bLSVnQhqmgV8LB-pELjpuVIa3Us1Gg";
const content = document.getElementById("content");

async function callRpc(fnName, payload) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fnName, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY
    },
    body: JSON.stringify(payload)
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error("Server error (" + res.status + "): " + text);
  }
  return res.json();
}

async function init() {
  const token = localStorage.getItem("cn_token");
  if (!token) {
    window.location.href = "index.html";
    return;
  }

  try {
    const result = await callRpc("cn_check_session", { p_token: token });
    if (!result.success) {
      localStorage.removeItem("cn_token");
      window.location.href = "index.html";
      return;
    }
    if (result.status !== "approved") {
      window.location.href = "pending.html";
      return;
    }
    content.innerHTML = `
      <div class="icon">✅</div>
      <h2>You're Approved!</h2>
      <p>Logged in as ${result.email}</p>
      <p>The upload and Excel download feature is coming in the next update.</p>
      <button onclick="logout()">Log Out</button>
    `;
  } catch (err) {
    content.innerHTML = "Error: " + err.message;
  }
}

async function logout() {
  const token = localStorage.getItem("cn_token");
  try { await callRpc("cn_logout", { p_token: token }); } catch (e) {}
  localStorage.removeItem("cn_token");
  localStorage.removeItem("cn_email");
  window.location.href = "index.html";
}

init();
</script>
</body>
</html>
